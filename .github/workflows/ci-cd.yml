name: WebShop CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/webshop
  PROJECT_DIR: webshop-microservices

jobs:
  # ============================================================
  # BUILD & TEST
  # ============================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: mvn clean verify -f pom.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '${{ env.PROJECT_DIR }}/**/target/surefire-reports/*.xml'

  # ============================================================
  # BUILD DOCKER IMAGES
  # ============================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: mvn clean package -DskipTests -f pom.xml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push eureka-server
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.PROJECT_DIR }}/eureka-server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-eureka-server:latest

      - name: Build and push config-server
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.PROJECT_DIR }}/config-server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-config-server:latest

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.PROJECT_DIR }}/api-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:latest

      - name: Build and push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.PROJECT_DIR }}/user-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-user-service:latest

      - name: Build and push product-service
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.PROJECT_DIR }}/product-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-product-service:latest

      - name: Build and push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.PROJECT_DIR }}/order-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-order-service:latest

      - name: Build and push inventory-service
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.PROJECT_DIR }}/inventory-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-inventory-service:latest

      - name: Build and push payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.PROJECT_DIR }}/payment-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-payment-service:latest

      - name: Build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.PROJECT_DIR }}/notification-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-notification-service:latest

  # ============================================================
  # DEPLOY - verifikacija da kompletan sistem radi zajedno
  # ============================================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/master'
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: mvn clean package -DskipTests -f pom.xml

      - name: Create .env file
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "DB_USERNAME=postgres" >> .env
          echo "DB_PASSWORD=postgres123" >> .env
          echo "JWT_SECRET=webshop-super-secret-key-must-be-at-least-256-bits-long" >> .env
          echo "MAIL_USERNAME=test@example.com" >> .env
          echo "MAIL_PASSWORD=testpassword" >> .env

      - name: Deploy stack with Docker Compose
        working-directory: ${{ env.PROJECT_DIR }}
        run: docker compose up -d --build eureka-server config-server api-gateway user-service product-service order-service inventory-service payment-service notification-service user-db product-db order-db inventory-db payment-db rabbitmq

      - name: Wait for services to become healthy
        run: sleep 90

      - name: Verify Eureka has registered services
        run: |
          curl -f http://localhost:8761/actuator/health || (echo "Eureka health check failed" && exit 1)

      - name: Verify API Gateway is reachable
        run: |
          curl -f http://localhost:8080/actuator/health || (echo "API Gateway health check failed" && exit 1)

      - name: Show running containers
        working-directory: ${{ env.PROJECT_DIR }}
        run: docker compose ps

      - name: Tear down stack
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: docker compose down -v