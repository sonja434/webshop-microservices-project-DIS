global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '${MAIL_USERNAME}'
  smtp_auth_username: '${MAIL_USERNAME}'
  smtp_auth_password: '${MAIL_PASSWORD}'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'email-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'email-notifications'
    - match:
        severity: warning
      receiver: 'email-notifications'

receivers:
  - name: 'email-notifications'
    email_configs:
      - to: '${MAIL_USERNAME}'
        send_resolved: true
        html: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}<br/>
          Description: {{ .Annotations.description }}<br/>
          Severity: {{ .Labels.severity }}<br/>
          Service: {{ .Labels.job }}<br/>
          <hr/>
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']